<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers — Aurex Admin</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><h2>Aurex</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> Bookings</a>
                <a href="quotes.html"><i class="fa-solid fa-file-invoice"></i> Quotes</a>
                <a href="pricing.html"><i class="fa-solid fa-tag"></i> Pricing</a>
                <a href="drivers.html"><i class="fa-solid fa-id-card"></i> Drivers</a>
                <a href="vehicles.html"><i class="fa-solid fa-car"></i> Vehicles</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <button class="btn btn-outline btn-sm sidebar-toggle" style="display:none;"><i class="fa-solid fa-bars"></i></button>
                <h1>Drivers</h1>
                <div class="topbar-actions">
                    <button class="btn btn-outline btn-sm" onclick="Data.exportCSV('drivers')"><i class="fa-solid fa-download"></i> Export</button>
                </div>
            </div>

            <div class="content">
                <div class="stats-grid" style="margin-bottom:1.5rem;">
                    <div class="stat-card"><div class="stat-label">Total Drivers</div><div class="stat-value" id="totalDrivers">0</div></div>
                    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value warning" id="pendingDrivers">0</div></div>
                    <div class="stat-card"><div class="stat-label">Approved</div><div class="stat-value success" id="approvedDrivers">0</div></div>
                </div>

                <div class="table-wrapper">
                    <div class="table-header">
                        <div class="filter-group">
                            <div class="search-box">
                                <i class="fa-solid fa-search"></i>
                                <input type="text" id="searchInput" placeholder="Search drivers..." oninput="renderTable()">
                            </div>
                            <select id="statusFilter" onchange="renderTable()">
                                <option value="">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>PHDL</th>
                                <th>DBS</th>
                                <th>Experience</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="driversTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Driver Details</h3>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body" id="viewContent"></div>
            <div class="modal-footer" id="viewFooter"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');

        function updateStats() {
            const drivers = Data.getDrivers();
            document.getElementById('totalDrivers').textContent = drivers.length;
            document.getElementById('pendingDrivers').textContent = drivers.filter(d => d.status === 'pending').length;
            document.getElementById('approvedDrivers').textContent = drivers.filter(d => d.status === 'approved').length;
        }

        function getFiltered() {
            let drivers = Data.getDrivers();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            if (search) {
                drivers = drivers.filter(d =>
                    ((d.firstName||'') + ' ' + (d.lastName||'')).toLowerCase().includes(search) ||
                    (d.email||'').toLowerCase().includes(search) ||
                    (d.mobile||'').toLowerCase().includes(search)
                );
            }
            if (status) drivers = drivers.filter(d => d.status === status);
            return drivers;
        }

        function renderTable() {
            updateStats();
            const drivers = getFiltered();
            const tbody = document.getElementById('driversTable');

            if (drivers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-id-card"></i><h3>No drivers found</h3></div></td></tr>';
                return;
            }

            tbody.innerHTML = drivers.map(d => `
                <tr>
                    <td><strong>${escapeHtml(d.firstName)} ${escapeHtml(d.lastName)}</strong></td>
                    <td>${escapeHtml(d.mobile)}<br><span style="font-size:0.78rem;color:var(--text-muted);">${escapeHtml(d.email)}</span></td>
                    <td>${escapeHtml(d.phdl) || '—'}</td>
                    <td>${escapeHtml(d.dbs) || '—'}</td>
                    <td>${escapeHtml(d.experience) || '—'}</td>
                    <td><span class="badge badge-${d.status === 'approved' ? 'completed' : d.status === 'rejected' ? 'cancelled' : 'pending'}">${d.status}</span></td>
                    <td>
                        <button class="btn btn-outline btn-sm" onclick="viewDriver('${d.id}')" title="View"><i class="fa-solid fa-eye"></i></button>
                        ${d.status === 'pending' ? `
                            <button class="btn btn-success btn-sm" onclick="updateDriverStatus('${d.id}','approved')" title="Approve"><i class="fa-solid fa-check"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="updateDriverStatus('${d.id}','rejected')" title="Reject"><i class="fa-solid fa-xmark"></i></button>
                        ` : ''}
                        <button class="btn btn-danger btn-sm" onclick="deleteDriver('${d.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function updateDriverStatus(id, status) {
            Data.updateDriver(id, { status });
            Toast.show(`Driver ${status}`, status === 'approved' ? 'success' : 'warning');
            renderTable();
        }

        function deleteDriver(id) {
            if (!confirm('Delete this driver application?')) return;
            Data.deleteDriver(id);
            Toast.show('Driver deleted', 'success');
            renderTable();
        }

        function viewDriver(id) {
            const d = Data.getDriver(id);
            if (!d) return;
            document.getElementById('viewContent').innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Full Name</div><div class="detail-value">${escapeHtml(d.firstName)} ${escapeHtml(d.lastName)}</div></div>
                    <div class="detail-item"><div class="detail-label">Mobile</div><div class="detail-value">${escapeHtml(d.mobile)}</div></div>
                    <div class="detail-item"><div class="detail-label">Email</div><div class="detail-value">${escapeHtml(d.email) || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">PHDL</div><div class="detail-value">${escapeHtml(d.phdl) || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">DBS Status</div><div class="detail-value">${escapeHtml(d.dbs) || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Experience</div><div class="detail-value">${escapeHtml(d.experience) || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value"><span class="badge badge-${d.status === 'approved' ? 'completed' : d.status === 'rejected' ? 'cancelled' : 'pending'}">${d.status}</span></div></div>
                    <div class="detail-item"><div class="detail-label">Applied</div><div class="detail-value">${formatDateTime(d.createdAt)}</div></div>
                </div>
                ${d.notes ? `<div style="margin-top:1.5rem;"><div class="detail-label" style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:0.5rem;">Notes</div><p>${escapeHtml(d.notes)}</p></div>` : ''}
            `;
            const footer = document.getElementById('viewFooter');
            if (d.status === 'pending') {
                footer.innerHTML = `
                    <button class="btn btn-outline" onclick="closeViewModal()">Close</button>
                    <button class="btn btn-danger" onclick="updateDriverStatus('${d.id}','rejected');closeViewModal();">Reject</button>
                    <button class="btn btn-accent" onclick="updateDriverStatus('${d.id}','approved');closeViewModal();">Approve</button>
                `;
            } else {
                footer.innerHTML = '<button class="btn btn-outline" onclick="closeViewModal()">Close</button>';
            }
            document.getElementById('viewModal').classList.add('open');
        }

        function closeViewModal() { document.getElementById('viewModal').classList.remove('open'); }
        document.getElementById('viewModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeViewModal(); });

        renderTable();
        if (window.innerWidth <= 900) document.querySelector('.sidebar-toggle').style.display = 'inline-flex';
        window.addEventListener('resize', () => {
            document.querySelector('.sidebar-toggle').style.display = window.innerWidth <= 900 ? 'inline-flex' : 'none';
        });
    </script>
</body>
</html>
