<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Aurex Admin</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Aurex</h2>
                <span>Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> Bookings</a>
                <a href="quotes.html"><i class="fa-solid fa-file-invoice"></i> Quotes</a>
                <a href="pricing.html"><i class="fa-solid fa-tag"></i> Pricing</a>
                <a href="drivers.html"><i class="fa-solid fa-id-card"></i> Drivers</a>
                <a href="vehicles.html"><i class="fa-solid fa-car"></i> Vehicles</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <button class="btn btn-outline btn-sm sidebar-toggle" style="display:none;"><i class="fa-solid fa-bars"></i></button>
                <h1>Dashboard</h1>
                <div class="topbar-actions">
                    <span style="font-size:0.82rem;color:var(--text-muted);" id="currentDate"></span>
                </div>
            </div>

            <div class="content">
                <div class="stats-grid" id="statsGrid"></div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
                    <div class="table-wrapper">
                        <div class="table-header">
                            <h2>Recent Bookings</h2>
                            <a href="bookings.html" class="btn btn-outline btn-sm">View All</a>
                        </div>
                        <table>
                            <thead><tr><th>Customer</th><th>Route</th><th>Status</th><th>Amount</th></tr></thead>
                            <tbody id="recentBookings"></tbody>
                        </table>
                    </div>

                    <div class="table-wrapper">
                        <div class="table-header">
                            <h2>Pending Quotes</h2>
                            <a href="quotes.html" class="btn btn-outline btn-sm">View All</a>
                        </div>
                        <table>
                            <thead><tr><th>Customer</th><th>Route</th><th>Date</th><th>Action</th></tr></thead>
                            <tbody id="pendingQuotes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');

        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const stats = Data.getStats();
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-label">Total Bookings</div><div class="stat-value">${stats.totalBookings}</div><div class="stat-change">${stats.pendingBookings} pending</div></div>
            <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value accent">${formatCurrency(stats.totalRevenue)}</div><div class="stat-change">from paid bookings</div></div>
            <div class="stat-card"><div class="stat-label">Pending Quotes</div><div class="stat-value warning">${stats.pendingQuotes}</div><div class="stat-change">${stats.totalQuotes} total</div></div>
            <div class="stat-card"><div class="stat-label">Drivers</div><div class="stat-value">${stats.totalDrivers}</div><div class="stat-change">${stats.pendingDrivers} pending approval</div></div>
        `;

        const bookings = Data.getBookings().slice(0, 5);
        const bookingsTbody = document.getElementById('recentBookings');
        if (bookings.length === 0) {
            bookingsTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:2rem;">No bookings yet</td></tr>';
        } else {
            bookingsTbody.innerHTML = bookings.map(b => `
                <tr>
                    <td>${escapeHtml(b.name)}</td>
                    <td>${escapeHtml(b.pickup)} → ${escapeHtml(b.dropoff)}</td>
                    <td><span class="badge badge-${b.status}">${b.status}</span></td>
                    <td>${formatCurrency(b.amount)}</td>
                </tr>
            `).join('');
        }

        const quotes = Data.getQuotes().filter(q => q.status === 'pending').slice(0, 5);
        const quotesTbody = document.getElementById('pendingQuotes');
        if (quotes.length === 0) {
            quotesTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:2rem;">No pending quotes</td></tr>';
        } else {
            quotesTbody.innerHTML = quotes.map(q => `
                <tr>
                    <td>${escapeHtml(q.name)}</td>
                    <td>${escapeHtml(q.pickup)} → ${escapeHtml(q.dropoff)}</td>
                    <td>${escapeHtml(q.date)}</td>
                    <td><a href="quotes.html" class="btn btn-accent btn-sm">Review</a></td>
                </tr>
            `).join('');
        }

        if (window.innerWidth <= 900) {
            document.querySelector('.sidebar-toggle').style.display = 'inline-flex';
        }
        window.addEventListener('resize', () => {
            document.querySelector('.sidebar-toggle').style.display = window.innerWidth <= 900 ? 'inline-flex' : 'none';
        });
    </script>
</body>
</html>
